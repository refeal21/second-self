[package]
name = "digital-twin-desktop"
version = "0.1.0"
description = "Local digital-twin workbench"
edition = "2021"
default-run = "digital-twin-desktop"
autobins = false

[features]
acceptance-harness = []

[[bin]]
name = "digital-twin-desktop"
path = "src/main.rs"

[[bin]]
name = "production-harness"
path = "src/bin/production-harness.rs"
required-features = ["acceptance-harness"]

[[bin]]
name = "queue-harness"
path = "src/bin/queue-harness.rs"
required-features = ["acceptance-harness"]

[[bin]]
name = "process-rss-sampler"
path = "src/bin/process-rss-sampler.rs"
required-features = ["acceptance-harness"]

[lib]
name = "digital_twin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dev-dependencies]
glob = "0.3"
tauri = { version = "2.8.5", features = ["test"] }
tauri-utils = "2.9.3"

[dependencies]
libc = "0.2"
png = "=0.18.1"
base64 = "0.22"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
rusqlite = { version = "0.37.0", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2.8.5", features = [] }
tauri-plugin-opener = "2.5.0"
tauri-plugin-shell = "2.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSResponder", "NSWindow", "NSApplication", "block2"] }
block2 = "0.6.2"
